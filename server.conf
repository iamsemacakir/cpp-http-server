# cpp-http-server configuration
#
# Loaded from ./server.conf at startup (or from the file named by the
# SERVER_CONFIG environment variable). Every setting is optional; the
# values below are the built-in defaults. Relative paths are resolved
# against the directory the server is started from.

# Address and port to listen on (port 0 picks a free port).
host = 0.0.0.0
port = 8080

# Static files and HTML error page templates.
document_root = public
error_pages = errors

# Worker threads handling connections (0 = one per CPU core).
threads = 0

# Drop clients that stall while sending or reading a request.
client_timeout_ms = 10000

# Persistent connections.
keep_alive = true
keep_alive_timeout_ms = 5000
keep_alive_max_requests = 100

# debug, info, warn, error or off (LOG_LEVEL overrides this).
log_level = info
