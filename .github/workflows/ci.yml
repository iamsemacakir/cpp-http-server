name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc,   cxx: g++,     build_type: Debug }
          - { os: ubuntu-latest, compiler: gcc,   cxx: g++,     build_type: Release }
          - { os: ubuntu-latest, compiler: clang, cxx: clang++, build_type: Debug }
          - { os: ubuntu-latest, compiler: clang, cxx: clang++, build_type: Release }
          - { os: macos-latest,  compiler: clang, cxx: clang++, build_type: Release }

    env:
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          cmake --version
          "$CXX" --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DHTTP_SERVER_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (real HTTP requests)
        run: scripts/smoke_test.sh ./build/http_server 18080
